<!-- SUBSCRIBE -->
<div class="subscribe-band" id="subscribe">
  <h2 class="sb-title">Get The Daily Brief Free</h2>
  <p class="sb-sub">Every weekday at 5:30 PM AEST. Free. Unsubscribe any time.</p>
  <style>#sd-fname::placeholder,#sd-email::placeholder{color:rgba(255,255,255,0.5)}</style>
<form id="sd-subscribe">
  <label for="sd-fname" style="color:#fff;font-size:13px;font-weight:600;display:block;margin-bottom:5px">First Name</label>
  <input id="sd-fname" type="text" name="firstname" placeholder="Your first name" autocomplete="given-name" style="width:100%;padding:14px 18px;border:1px solid rgba(255,255,255,0.35);border-radius:2px;font-size:15px;box-sizing:border-box;background:rgba(255,255,255,0.12);color:#fff;margin-bottom:12px" required>
  <label for="sd-email" style="color:#fff;font-size:13px;font-weight:600;display:block;margin-bottom:5px">Email *</label>
  <input id="sd-email" type="email" name="email" placeholder="Your email address" autocomplete="email" style="width:100%;padding:14px 18px;border:1px solid rgba(255,255,255,0.35);border-radius:2px;font-size:15px;box-sizing:border-box;background:rgba(255,255,255,0.12);color:#fff;margin-bottom:14px" required>
  <button type="submit" style="background:#F5C518;color:#000;font-size:15px;font-weight:700;padding:14px 32px;border:none;border-radius:2px;cursor:pointer;width:100%">Subscribe Free</button>
  <p id="sd-msg" style="color:#fff;font-size:14px;text-align:center;margin-top:10px;display:none"></p>
</form>
<script>
document.getElementById('sd-subscribe').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=this.querySelector('button'),msg=document.getElementById('sd-msg');
  btn.textContent='Submitting…';btn.disabled=true;
  try{
    var res=await fetch('https://api.hsforms.com/submissions/v3/integration/submit/443784781/9d3de95d-3727-42e4-be3c-e12d377e20e7',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:[{name:'firstname',value:document.getElementById('sd-fname').value},{name:'email',value:document.getElementById('sd-email').value}],context:{pageUri:location.href,pageName:document.title}})});
    if(res.ok){msg.textContent='Thanks! Check your inbox soon.';msg.style.display='block';e.target.reset();}
    else throw new Error();
  }catch(err){msg.textContent='Something went wrong. Please try again.';msg.style.display='block';}
  btn.textContent='Subscribe Free';btn.disabled=false;
});
</script>
</div>
